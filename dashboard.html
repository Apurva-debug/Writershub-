<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your matches — WritersClub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="spine-mark"></span>
    <span class="brand">WritersClub<small id="welcomeLine"></small></span>
  </header>

  <div class="hero" id="myBookHero">
    <h1 id="myBookTitle">Your book</h1>
    <p id="myBookMeta"></p>
  </div>

  <div class="section-label">Books matched to your reading interests</div>
  <div id="matchList"></div>

  <div class="section-label">Your active support tasks</div>
  <div id="taskList"></div>
  <p id="noTasks" style="display:none;">No tasks yet — start one from a match above.</p>

  <footer class="note">Prototype note: matches and tasks are stored on this phone only for now.</footer>
</div>

<script src="app.js"></script>
<script>
const user = WC.getCurrentUser();
if (!user || !user.bookTitle){
  window.location.href = 'signup.html';
}

document.getElementById('welcomeLine').textContent = `Welcome back, ${user.name}`;
document.getElementById('myBookTitle').textContent = user.bookTitle;
document.getElementById('myBookMeta').textContent =
  `${user.writingGenre} · matching mode: ${user.matchMode === 'mutual' ? 'Mutual pairing' : 'Open matching'}`;

function renderMatches(){
  const list = document.getElementById('matchList');
  list.innerHTML = '';
  const matches = WC.findMatches(user);
  if (matches.length === 0){
    list.innerHTML = '<p>No matches yet for your reading interests — check back as more writers join.</p>';
    return;
  }
  matches.forEach(m => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="book-title">${m.bookTitle}</div>
      <div class="book-meta">by ${m.name}</div>
      <span class="genre-tag">${m.writingGenre}</span>
      <div style="margin-top:12px;">
        <button class="btn btn-secondary" data-id="${m.id}">Start support task (7-day deadline)</button>
      </div>
    `;
    card.querySelector('button').addEventListener('click', () => {
      WC.startTask(user, m, 7);
      renderTasks();
      card.querySelector('button').disabled = true;
      card.querySelector('button').textContent = 'Task started';
    });
    list.appendChild(card);
  });
}

function renderTasks(){
  const list = document.getElementById('taskList');
  const empty = document.getElementById('noTasks');
  list.innerHTML = '';
  const mine = WC.getMatches().filter(m => m.userId === user.id);
  empty.style.display = mine.length === 0 ? 'block' : 'none';
  mine.forEach(m => {
    const status = WC.matchStatus(m);
    const badgeClass = status === 'confirmed' ? 'status-confirmed' : (status === 'mismatch' ? 'status-mismatch' : 'status-pending');
    const badgeText = status === 'confirmed' ? 'Both confirmed' : (status === 'mismatch' ? 'Deadline passed, unresolved' : 'In progress');
    const deadline = new Date(m.deadline).toLocaleDateString();
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="book-title">${m.partnerBook}</div>
      <div class="book-meta">with ${m.partnerName} · due ${deadline}</div>
      <div style="margin-top:8px;"><span class="status-badge ${badgeClass}">${badgeText}</span></div>
      <div style="margin-top:12px;">
        <button class="btn btn-secondary" ${m.userConfirmed ? 'disabled' : ''}>
          ${m.userConfirmed ? 'You confirmed' : 'Mark my part done'}
        </button>
      </div>
    `;
    const btn = card.querySelector('button');
    if (!m.userConfirmed){
      btn.addEventListener('click', () => {
        WC.confirmMatch(m.id, 'user');
        renderTasks();
      });
    }
    list.appendChild(card);
  });
}

renderMatches();
renderTasks();
</script>
</body>
</html>
